; ====================================================================================
;        ENERGETIChESKIY BALANS IC2 EXPERIMENTAL (tol'ko klyuchi, kotorye IC2 real'no chitaet)
; Neizvestnye klyuchi IC2 molcha ignoriruet. V staroy versii fayla NE suschestvovali:
;   [balance / reactor / cycle] uranium      - srok zhizni sterzhnya v IC2 Exp ne nastraivaetsya
;   [balance / reactor / output] EU          - vykhod reaktora zadayotsya klyuchom nuclear nizhe
;   [balance / energy / consumption] ...     - raskhod Advanced Miner i mashin ne nastraivaetsya
;   [balance / uu] energyFactor, scrapFactor - pravil'nyy klyuch: uuEnergyFactor (mnozhitel')
; ====================================================================================

[worldgen]
; Rudy IC2 otklyucheny: med'/olovo/svinets/uran teper' generiruet geology.json (CoFH).
; Blok IC2:blockOreUran pri etom prodolzhaet suschestvovat' i ispol'zuetsya v zhilakh.
copperOre = false
tinOre = false
uraniumOre = false
leadOre = false

[balance]
; Mnozhitel' energii na proizvodstvo UU-materii. 3.0 = v 3 raza dorozhe standarta.
uuEnergyFactor = 3.0

[balance / energy / generator]
; Generator IC2 (pech' + dinamo): 0.25 -> 1000 EU s uglya (2.5 EU/t). Tol'ko chtoby zapustit' pervye mashiny. Teplovoy generator + Stirling = 8000 EU.
generator = 0.25
; Bazovaya solnechnaya panel' IC2 (zamena Advanced Solars): 8 EU/t vmesto 1 (bylo 16 - perebor protiv generatora 2.5 EU/t)
solar = 8.0
; Pryamoy EU s yadernogo reaktora (rezhim bez korpusa) = 0. Reaktor ne generator, a istochnik tepla:
; energiya - tol'ko cherez zhidkostnyy rezhim (korpus 5x5x5 -> teplonositel' -> teploobmennik -> par -> turbina).
; Bez korpusa reaktor po-prezhnemu greetsya i vzryvaetsya, no toka ne dayot.
nuclear = 0.0
; Staryy vetryak (ustarevshiy) - vdvoe slabee
wind = 0.5
; Generator Stirlinga (teplo -> EU) - rannyaya teplovaya energetika, vdvoe moschnee
Stirling = 2.0
; Geotermal'nyy generator (lava -> EU) - vdvoe slabee: lava iz Nezera beskonechna, eto bazovaya nagruzka
geothermal = 0.5

[balance / energy / FluidReactor]
; Perevod tepla reaktora v goryachiy teplonositel' - standart. Okupaemost' dayot parovaya turbina (steam = 2.0 nizhe).
outputModifier = 1.0

[balance / energy / kineticgenerator]
; Kineticheskiy vetrogenerator - vdvoe slabee: veter - eto podspor'e, a ne osnovnaya energetika
wind = 0.5
; Parovaya kineticheskaya turbina. Zavod 1.46: paroprovod Zavod otdayot ey i par Railcraft (steam -> ic2steam),
; poetomu obychnyy par = kak turbina Railcraft: 1 mB -> 2.5 kU -> 0.625 EU (320 mB/t -> 200 EU/t).
; Peregretyy par IC2 (teploobmennik reaktora) - vdvoe bol'she: 1.25 EU/mB. Bylo 2.0 (obychnyy par 1 EU/mB - turbina
; Railcraft teryala smysl).
steam = 1.25
; Elektricheskiy kineticheskiy generator - vdvoe dorozhe: 1 EU -> 2 kU. Elektroprivod vala Zavod (mufta): 1 l.s. = 10 kU = 5 EU/t
electric = 0.5

[balance / uu-values / predefined]
; Tsena v UU-materii (bulyzhnik = 1). Replikator ne dolzhen zamenyat' geologiyu i tsepochku platinoidov.
; Standart IC2: iridievaya ruda 12000.
IC2:itemOreIridium = 120000
IC2:itemShardIridium = 13500
IC2:blockOreUran = 30000
IC2:itemUran238 = 30000
IC2:itemUran235 = 300000
IC2:itemUran235small = 35000
IC2:itemPlutonium = 300000
IC2:itemPlutoniumSmall = 35000
minecraft:diamond = 40000
minecraft:diamond_ore = 40000
IC2:itemPartIndustrialDiamond = 40000
IC2:itemPartCoalChunk = 40000
