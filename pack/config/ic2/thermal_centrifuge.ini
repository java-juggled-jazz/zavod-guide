; thermal centrifuge recipes
; created 04.07.2015 18:15:38
;
; To change/remove/add/replace recipes, modify this file and put it in the
; "minecraft/config/ic2" folder. Do NOT modify the file inside of the IC2 jar file.
;
; machine recipes are as follows:
;  <input> = <output 1>[, <output n>...]
;
; output:
;  <name>[@<metadata>[@<amount>]]
;
; input:
;  <name>[@<metadata>[@<amount>]]
; Note: if you want to specify the amount, you also have to specify the metadata.
;
; name references one of the following:
; - the global unique item name as introduced by MC 1.7 (mod id:registry name)
; - an ore dictionary entry with OreDict:<ore dict name>
; - a fluid container item for a fluid with Fluid:<fluid name>
;
; If you want to specify the amount as well, you have to put the metadata there as well.
; When you don't want to change the metadata of the items, use -1 as meta:
; OreDict:<OreDictName>@-1@<amount>
; Fluid:<FluidName>@-1@<amount>
;
; the metadata is specified as follows:
; - not at all -> metadata 0 is required or for ore-dictionary names their original metadata
; - * -> any metadata is allowed, overriding ore-dictionary metadata values to acccept any
; - <some number> -> the specific value is required, overriding ore-dictionary specifications
;
; Line breaks are only allowed with a leading \ character, but never before =.
;
; You also need to specify the heat required:
;  @heat:<heat>
;
; Note: this is a Input = Output mapping.
;
;---

; Clay Dust
OreDict:dustClay@-1@4 = IC2:itemDust2 @heat:250
; Purified Crushed Gold Ore
; modpack: copper-gold vein -> + tiny copper
OreDict:crushedPurifiedGold = IC2:itemDustSmall@4 IC2:itemDust@4 IC2:itemDustSmall@1 @heat:2000
; Pellets of RTG Fuel
IC2:itemRTGPellet = IC2:itemPlutonium@0@3 IC2:itemDust@5@54 @heat:5000
; Crushed Gold Ore
OreDict:crushedGold = IC2:itemDustSmall@4 IC2:itemDust@4 IC2:itemDust@9 @heat:2000
; Cobblestone
minecraft:cobblestone = IC2:itemDust@9 @heat:100
; Crushed Iron Ore
OreDict:crushedIron = IC2:itemDustSmall@2 IC2:itemDust@5 IC2:itemDust@9 @heat:1500
; Fuel Rod (Depleted Uranium)
; modpack: closed fuel cycle - reprocessing returns more U-238 and plutonium
; Crushed Lead Ore
OreDict:crushedLead = IC2:itemDust@10 IC2:itemDust@9 @heat:2000
; Purified Crushed Tin Ore
OreDict:crushedPurifiedTin = IC2:itemDustSmall IC2:itemDust@7 @heat:1000
; Crushed Tin Ore
OreDict:crushedTin = IC2:itemDustSmall IC2:itemDust@7 IC2:itemDust@9 @heat:1000
; Purified Crushed Iron Ore
; modpack: ferronickel vein -> nickel nuggets (zavod, B1) as byproduct
OreDict:crushedPurifiedIron = IC2:itemDustSmall@2 IC2:itemDust@5 zavod:nugget_nickel@2 @heat:1500
; Nether Quartz
minecraft:quartz@0@2 = IC2:itemDustSmall@7 @heat:500
; Slag
; (otklyucheno: shlak -> zoloto + ugol'naya pyl'. Shlak idyot v shlakotsement i tomasshlak, scripts/precious.zs)
;IC2:itemSlag = IC2:itemDustSmall@2 IC2:itemDust@2@5 @heat:1500
; Purified Crushed Lead Ore
; modpack: galena -> 2 tiny silver instead of tiny copper
OreDict:crushedPurifiedLead = IC2:itemDustSmall@4@2 IC2:itemDust@10 @heat:2000
; Purified Crushed Silver Ore
OreDict:crushedPurifiedSilver = IC2:itemDustSmall@5 IC2:itemDust@6 @heat:1000
; Crushed Copper Ore
OreDict:crushedCopper = IC2:itemDustSmall@3 IC2:itemDust@3 IC2:itemDust@9 @heat:500
; Crushed Silver Ore
OreDict:crushedSilver = IC2:itemDust@6 IC2:itemDust@9 @heat:2000
; Purified Crushed Copper Ore
; modpack: copper-gold vein -> tiny gold instead of tiny tin
OreDict:crushedPurifiedCopper = IC2:itemDustSmall@2 IC2:itemDust@3 @heat:500


