# Climate Control 0.8.2 (Zavod A18, docs/worldgen.md). Only keys changed from defaults (plus half size, which the band math relies on);
# the mod fills in the rest on first start. Read when a NEW world is created and copied into <world>/worldSpecificConfig.
# Earth-like latitude bands: climate cell 512 blocks (half size) x width 2 = ~1024-block band along Z.
# +Z (south): warm -> hot -> warm; -Z (north): cool -> snowy -> cool; period ~6 km. Spawn sits on the warm/cool line.

"climate zone parameters" {
    B:"Half Zone Size"=true
    B:"Quarter Zone Size"=false
    B:"Random Biomes"=false
    I:bandedClimateWidth=2
    I:bandedClimateOffset=0
    B:"Mountains in Mountain Chains"=true
    B:"Frozen Icecaps"=false
}

"ocean control parameters" {
    B:SeparateLandmasses=true
}
