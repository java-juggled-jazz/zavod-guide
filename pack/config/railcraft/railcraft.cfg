# Configuration file
# Modpack: only Railcraft "poor ore" generation is switched off here; Railcraft fills in all other options with defaults.
# Saltpeter, sulfur, abyssal and quarried stone stay ON. Firestone is OFF (endless fuel).

worldgen {
    generate {
        B:copper=false
        B:gold=false
        B:iron=false
        B:lead=false
        B:tin=false
        B:firestone=false
    }
}

tweaks {
    steam {
        # Kotly tratyat na chetvert' men'she topliva na tot zhe par (standart 1.0)
        D:fuelPerSteamMultiplier=0.75
    }
}
