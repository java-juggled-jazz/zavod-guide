# Configuration file

~CONFIG_VERSION: 2.1

# Zavod 1.57.21 (A31): only the axe wear is changed, everything else is the mod's default (missing keys are filled in on start).

general_settings {

    item_settings {
        # [Global] Axes and shears will take damage this many times for each log broken. Remaining damage is
        # rounded and applied to tools when a tree is finished.
        # Zavod: half wear (default 1.0) - an iron axe fells twice as many trees by hand. [range: 0.1 ~ 50.0, default: 1.0]
        D:damageMultiplier=0.5
    }

}
