# Configuration file
# Modpack: only the World section is set here; CoFH Core fills in all other options with defaults on first launch.

World {
    # Vanilla ore generation is REPLACED by config/cofh/world/Vanilla.json (coal, iron, gold, redstone, diamond are disabled there).
    B:ReplaceVanillaGeneration=true

    # Retrogen: features marked "retrogen": true that a chunk has not received yet are added when it loads.
    # Only world/zavod-clay.json is new; geology veins are "retrogen": false, vanilla ores are already recorded in old chunks.
    B:RetroactiveOreGeneration=true
}
