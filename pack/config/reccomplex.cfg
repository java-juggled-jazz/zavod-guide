# Configuration file
# Chastichnyy konfig sborki: Recurrent Complex dopishet ostal'nye klyuchi sam.
# Esli u tebya uzhe est' svoy reccomplex.cfg - ne zamenyay fayl, a vpishi eti klyuchi v sektsiyu balancing.

balancing {
    # Ne generirovat' magiyu i fentezi: misticheskie i porchenye derev'ya Kraya, el'fiyskiy prud, kristall so spaunerom
    # ognennykh demonov, svyatoy i nechestivyy monolity, stikhiynye svyatilishcha, ved'miny stolby.
    S:structureGenerationMatcher=!(MysticalTree | MysticalTree1 | MysticalTree2 | CorruptedEnderTree | ElvenPond | BlazeSpawnerCrystal | MonolythHoly | MonolythUnholy | ShrineSmallFire | ShrineSmallEarth | ShrineSmallWater | ShrineSmallAir | WitchPillars | ClayMound | ClayMound1 | StoneMound | StoneMound1 | StoneMound2 | StoneMound3 | LonePillars | WoodWallRemains | DesertBeacon | DesertWatchtower | DesertHut | DinosaurSkull | UnnaturalCrater | WellShrine | SmallWoodenCottage)

    # "Artefakt" RC (zacharovannyy imennoy mech ili bronya) VSEGDA zamenyaetsya nashim trofeem:
    # pritsel, BAR, bronezhilet, PNV, zacharovannoe yabloko, iridiy (structures/active/ZavodTrophy.rcig). Chertezhey tam net -
    # oni v fortakh s garnizonom (DesertFort, SmallFortRuins: ZavodFortChest.rcig) i v kreposti.
    S:customArtifactTag=ZavodTrophy
    S:customArtifactChance=1.0
}
