# Configuration file
# Chastichnyy konfig sborki: BuildCraft dopishet ostal'nye klyuchi sam.

general {
    # Syruyu neft' v DVS ne l'yut: 30 000 RF s vedra vmesto 150 000. Toplivo - 2 250 000.
    D:fuel.oil.combustion=0.2
    I:fuel.fuel.combustion.energyOutput=90
    # Zhidkostnye truby: bazovaya propusknaya 20 (bylo 10): kamennaya 40, zheleznaya 80, zolotaya i almaznaya 160 mB/t.
    # Truby BC - magistral' dlya lyubykh zhidkostey bez poter'; truby Zavod - tol'ko par i voda, s poteryami para.
    I:pipes.baseFluidRate=20
    # Zavod 1.56.31 (B5): nasos vycherpyvaet istochniki vody (bylo: 9+ blokov vody - beskonechno). Beskonechna voda tol'ko v reke i more.
    B:pumpsConsumeWater=true
}

worldgen {
    # Neftyanye istochniki pod krupnymi mestorozhdeniyami - beskonechnaya neft'. Vyklyucheno: skvazhiny konechnye.
    B:spawnOilSprings=false
    # Neftyanye skvazhiny-fontany i ozyora BC: vyklyucheny (1.56.30). Neft' - virtual'nye zalezhi Zavod (burovaya + kachalka).
    D:oilWellGenerationRate=0.0
}
