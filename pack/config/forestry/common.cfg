# Configuration file
# Chastichnyy konfig sborki: Forestry dopishet ostal'nye klyuchi sam.
# Med' i olovo - tol'ko v zhilakh (config/cofh/world/geology.json). Rossyp' rudy Forestry obkhodila redkie zhily.
# Apatit ostavlen: fosfatnaya poroda, idyot na udobreniya.

world {
    generate {
        ore {
            B:copper=false
            B:tin=false
        }
        # Ul'i: default 1.0 - lesnoy uley 3 % lesnykh chankov, lugovoy 1 %. x2 (Zavod 1.56.63).
        beehives {
            S:amount=2.0
        }
    }
}
