# Configuration file
# Chastichnyy konfig sborki: Pam's HarvestCraft dopishet ostal'nye klyuchi sam.
# Esli u tebya uzhe est' svoy harvestcraft.cfg - ne zamenyay fayl, a vpishi eti klyuchi.

# Sol' Pam's otklyuchena: sol' v sborke - tol'ko solevarnya Zavod i kamennaya sol' (shakhta).
salt {
    B:enablesaltGeneration=false
}

# Rynok ne prodayot nichego: zhivotnye, sazhentsy i semena za izumrudy - dobycha iz nichego. Retsept rynka tozhe ubran.
"market sales" {
    B:marketsellSeeds=false
    B:marketselltemperateSaplings=false
    B:marketselltropicalSaplings=false
    B:marketsellconiferousSaplings=false
    B:marketsellPig=false
    B:marketsellSheep=false
    B:marketsellCow=false
    B:marketsellChicken=false
    B:marketsellHorse=false
    B:marketsellBonemeal=false
}

"miscellaneous recipes" {
    # Sol' iz vody v kastryule - obkhod solevarni (i besplatnaya solyanaya kislota cherez retortu).
    B:enablesaltfromwaterbucketrecipe=false
}

# Sady - edinstvennyy istochnik semyan Pam's (rynok semena ne prodayot). Default 2 popytki na chank na tip sada:
# na zemle sad pochti ne viden v trave. x2 (Zavod 1.56.63, docs/worldgen.md).
gardens {
    I:gardenRarity=4
}
