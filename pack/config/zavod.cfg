# Configuration file
# MODPACK: Zavod 1.16.0 - davlenie mobov. Polozhit' v config/ s zamenoy (inache ostanutsya starye znacheniya).

mobs {
    # Peaceful is replaced by Easy at once (options button and /difficulty)
    B:blockPeaceful=true

    # Share of natural creeper spawns that go through (1 = vanilla) [range: 0.0 ~ 1.0, default: 0.1]
    S:creeperKeep=0.1

    # Non-soldier: chance for each empty armor slot to get a chainmail piece (checked before leather) [range: 0.0 ~ 1.0, default: 0.03]
    S:chainPieceChance=0.03

    # Fort guards: enchanting level of armor and weapon (0 = none) [range: 0 ~ 30, default: 20]
    I:guardEnchantLevel=20

    # Fort guards: attack damage multiplier [range: 1.0 ~ 5.0, default: 1.5]
    S:guardDamage=1.5

    # Fort guards: max health multiplier [range: 1.0 ~ 10.0, default: 2.0]
    S:guardHealth=2.0

    # Fort guards: movement speed multiplier [range: 1.0 ~ 2.0, default: 1.2]
    S:guardSpeed=1.2

    # Non-soldier: chance for each empty armor slot to get a leather piece [range: 0.0 ~ 1.0, default: 0.25]
    S:leatherPieceChance=0.25

    # Difficulty is fixed to this: easy/normal/hard (options button greyed out, /difficulty reverted); off - only blockPeaceful [default: hard]
    S:lockDifficulty=hard

    # New chunks: mineshaft cave spider spawners become zombie spawners, cobwebs below Y 64 removed, no spider dungeons
    B:noSpiderSpawners=true

    # Skeleton swaps its bow for a shovel/pickaxe and fights in melee [range: 0.0 ~ 1.0, default: 0.15]
    S:skeletonToolChance=0.15

    # Flan's WW2 armies allowed (item prefix: <army>Helmet/Coat/Pants/Boots); one army per mob
    S:soldierArmies=russian,german,american,british,japanese

    # Army by biome: cold - USSR/Germany, jungle - Japan/USA, sand/savanna - Britain/Germany, else - Europe
    B:soldierByBiome=true

    # Zombie/skeleton without a tool becomes a soldier in a Flan's WW2 uniform [range: 0.0 ~ 1.0, default: 0.2]
    S:soldierChance=0.2

    # Soldier: chance for each empty armor slot to get a uniform piece [range: 0.0 ~ 1.0, default: 0.5]
    S:soldierPieceChance=0.5

    # Ticks between surface spawn passes [range: 20 ~ 1200, default: 100]
    I:surfaceInterval=100

    # Entity name:weight list
    S:surfaceMobs=Zombie:55,Skeleton:35,Spider:10

    # Max monsters added per pass per player [range: 1 ~ 8, default: 2]
    I:surfacePerPass=2

    # Radius for counting and spawning, blocks [range: 32 ~ 96, default: 48]
    I:surfaceRadius=48

    # Monsters under open sky kept around a player on the surface (0 = off) [range: 0 ~ 64, default: 10]
    I:surfaceTarget=10

    # Zombie gets a shovel/pickaxe if its hand is empty [range: 0.0 ~ 1.0, default: 0.35]
    S:zombieToolChance=0.35

    # A creeper stuck at a wall a few blocks from the player ignites itself [default: true]
    B:siegeCreeper=true

    # Zombies, melee skeletons and dungeon spawner mobs dig soft blocks (dirt, sand, gravel, wood, glass...) toward an unreachable player; never stone [default: true]
    B:siegeDig=true

    # Mob digging speed (1 = half of a bare-handed player) [range: 0.1 ~ 10.0, default: 1.0]
    S:siegeDigSpeed=1.0

    # Bow skeletons without line of sight walk around the cover [default: true]
    B:siegeFlank=true

    # Dungeon spawner mobs never despawn and always dig; solid blocks cannot be placed against a spawner [default: true]
    B:spawnerGuard=true
}


world {
    # Strongholds per world (vanilla 3), all on the 640-1150 block ring; only new chunks [range: 3 ~ 64, default: 12]
    I:strongholdCount=12
}


weapons {
    # Flan's guns wear out their barrels; rebarrel: gun + barrel in a crafting grid
    B:barrelWear=true

    # gun:shots:L|S (long/short barrel), Flan's short names
    S:barrelLife=webley:1500:S,colt:1500:S,nagant:1200:L,nagantSniper:1200:L,kar98k:1200:L,kar98kSniper:1200:L,m1Garand:1000:L,BAR:1000:L,trenchgun:1500:L,ak47:1500:L,m16a4:1200:L

    # bullet:ticks - Flan's bullet dies after N ticks in flight (speed ~5 blocks/tick: 3 = ~15 blocks)
    S:bulletTicks=trenchgunAmmo:3
}


transmission {
    # Bessemer converter blowing engine power draw while blowing, hp [range: 1 ~ 10000, default: 24]
    I:blowerHp=24

    # IC2 lathe coupling power draw, hp [range: 1 ~ 1000, default: 4]
    I:couplingHp=4

    # Small steam engine power, hp [range: 1 ~ 1000, default: 8]
    I:engineHp=8

    # High-pressure steam engine power, hp [range: 1 ~ 10000, default: 40]
    I:engineLargeHp=40

    # Bronze excavator (5x5 pit, no booms) power draw while digging, hp [range: 1 ~ 1000, default: 16]
    I:excavatorHp=16

    # Steel excavator (9x9 pit, no booms) power draw while digging, hp [range: 1 ~ 10000, default: 32]
    I:excavatorLargeHp=32

    # Bronze excavator: pit radius grows by this per boom section (5 -> 7 -> 9 ...) [range: 1 ~ 8, default: 1]
    I:excavatorBoomStep=1

    # Excavator power draw is multiplied by this per boom section (same blocks per second, a wider layer just takes longer) [range: 1.0 ~ 4.0, default: 1.5]
    S:excavatorBoomPowerMult=1.5

    # Steel excavator: pit radius grows by this per boom section (9 -> 13 -> 17 ...) [range: 1 ~ 8, default: 2]
    I:excavatorLargeBoomStep=2

    # Steel excavator: max boom sections stacked on top (9x9 pit) [range: 0 ~ 16, default: 3]
    I:excavatorLargeMaxBooms=3

    # Bronze excavator: max boom sections stacked on top (5x5 pit, each section widens the square) [range: 0 ~ 16, default: 4]
    I:excavatorMaxBooms=4

    # Excavator: ticks per block of hardness 1 at full speed (stone 1.5, ore 3); large one is twice as fast [range: 1 ~ 100, default: 3]
    I:excavatorTicksPerHardness=3

    # Steam hammer power draw when driven from a shaft, hp (own steam works as before) [range: 1 ~ 1000, default: 3]
    I:hammerHp=3

    # IC2 kinetic units per 1 hp per tick (coupling) [range: 1 ~ 1000, default: 10]
    I:kuPerHp=10

    # Max shafts/pulleys/gearboxes/engines in one line [range: 8 ~ 1024, default: 128]
    I:maxNodes=128

    # Cartridge press power draw when driven from a shaft, hp [range: 1 ~ 1000, default: 2]
    I:pressHp=2

    # Shaft pump power draw while pumping, hp [range: 1 ~ 1000, default: 2]
    I:pumpHp=2

    # Ticks between line rescans (break/build is picked up within this time) [range: 5 ~ 200, default: 20]
    I:rescanTicks=20

    # RF per 1 hp per tick (coupling to Railcraft rolling machine only) [range: 1 ~ 100, default: 2]
    I:rfPerHp=2

    # Railcraft rolling machine coupling power draw, hp (machine needs 50 RF/t at full speed) [range: 1 ~ 1000, default: 16]
    I:rollerHp=16

    # Sawmill power draw while sawing, hp [range: 1 ~ 1000, default: 3]
    I:sawmillHp=3

    # Stamp mill power draw while working, hp [range: 1 ~ 1000, default: 16]
    I:stampMillHp=6

    # Steam per 1 hp per tick, mB [range: 1 ~ 100, default: 1]
    I:steamPerHp=1

    # Skip hoist winch power draw while hoisting, hp [range: 1 ~ 1000, default: 4]
    I:winchHp=4

    # Wire drawing mill power draw while working, hp [range: 1 ~ 1000, default: 2]
    I:wireMillHp=2


    # Reactor steam generator: steam mB per 1 mB of IC2 hot coolant [range: 1 ~ 1000, default: 40]
    # Calutron: EU to enrich one natural uranium dioxide (-> 1 small U-235 + 3 U-238) [range: 1000 ~ 10000000, default: 100000]
    I:calutronEuPerBatch=100000

    I:steamPerHotCoolant=40
}


pipes {
    # Bronze steam/water pipe throughput, mB per tick [range: 1 ~ 100000, default: 40]
    I:bronzeFlow=40

    # Max pipes in one network [range: 16 ~ 8192, default: 512]
    I:maxPipes=512

    # Steam lost in pipes, percent per 10 blocks of path (water is not lost) [range: 0 ~ 100, default: 1]
    I:steamLossPer10Blocks=1

    # Steel steam/water pipe throughput, mB per tick [range: 1 ~ 100000, default: 80]
    I:steelFlow=80
}


steel {
    # IC2 blast furnace (open hearth) remelts iron/steel scrap: items that are mostly iron or steel by recipe [default: true]
    B:scrapMelt=true

    # Minimum share of iron/steel in an item (by recipe mass) to count as scrap [range: 0.1 ~ 1.0, default: 0.5]
    S:scrapMinShare=0.5

    # Share of the iron in a scrap item that comes out as steel (rest goes to slag) [range: 0.1 ~ 1.0, default: 0.75]
    S:scrapYield=0.75
}


misc {
    # Write config/zavod-recipes.json (all recipes) on world start - for the recipe calculator [default: true]
    B:recipeDump=true
}
